<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./images/favicon.svg" type="image/svg+xml" />
  <title>Dealett - Logga in</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="./assets/account.css" />
    <link rel="stylesheet" href="styles-redesign.css" />
    <link rel="stylesheet" href="styles-editorial.css" />
  </head>
<body class="account-page login-page">
  <div data-include="header"></div>

  <main class="login-main">
    <section class="login-card account-card">
      <div class="login-head">
        <span class="account-kicker">Demol&auml;ge</span>
        <h1>Logga in</h1>
        <p>Skapa en lokal testsession f&ouml;r att se Mina sidor-fl&ouml;det.</p>
      </div>

      <form id="loginForm" class="login-form">
        <label for="loginEmail">
          <span>E-post</span>
          <input id="loginEmail" type="email" required placeholder="namn@email.se" autocomplete="email" />
        </label>

        <label for="loginPassword">
          <span>L&ouml;senord</span>
          <input id="loginPassword" type="password" required placeholder="••••••••" autocomplete="current-password" />
        </label>

        <button class="primary-btn full-btn" type="submit">Logga in</button>
      </form>

      <p class="login-note">
        Har du inget konto?
        <button id="registerDemoBtn" type="button">Registrera dig</button>
      </p>
      <p class="login-demo-note">
        Detta &auml;r inte riktig autentisering. En backend beh&ouml;vs innan konton, ordrar eller personuppgifter hanteras skarpt.
      </p>
    </section>
  </main>

  <div data-include="footer"></div>

  <script src="./assets/cart-helpers.js"></script>
  <script src="./assets/network-utils.js"></script>
  <script src="script.js"></script>
  <script src="./assets/login.js"></script>
</body>
</html>
